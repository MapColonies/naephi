{{- $tracingUrl := include "naephi.tracingUrl" . -}}
{{- $metricsUrl := include "naephi.metricsUrl" . -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-configmap" (include "naephi.fullname" .) }}
data:
  CONFIG_OFFLINE_MODE: 'true'
  REQUEST_PAYLOAD_LIMIT: {{ .Values.env.requestPayloadLimit | quote }}
  RESPONSE_COMPRESSION_ENABLED: {{ .Values.env.responseCompressionEnabled | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  LOG_PRETTY_PRINT_ENABLED: {{ .Values.env.logPrettyPrintEnabled | quote }}
  {{- if .Values.env.tracing.enabled }}
  TELEMETRY_TRACING_ENABLED: 'true'
  TELEMETRY_TRACING_URL: {{ $tracingUrl }}
  {{- end }}
  {{- if .Values.env.metrics.enabled }}
  TELEMETRY_METRICS_ENABLED: 'true'
  TELEMETRY_METRICS_URL: {{ $metricsUrl }}
  {{- end }}
  npm_config_cache: /tmp/
  {{- with .Values.configManagement }}
  CONFIG_NAME: {{ .name | quote }}
  CONFIG_VERSION: {{ .version | quote }}
  CONFIG_OFFLINE_MODE: {{ .offlineMode | quote }}
  CONFIG_SERVER_URL: {{ .serverUrl | quote }}
  {{- end }}

  # App
  APP_UI_PATH: {{ .Values.env.app.uiPath | quote }}
  APP_INIT_TIMEOUT: {{ .Values.env.app.initTimeout | quote }}
  APP_OSM_ID_RESOLVER: {{ .Values.env.app.osmIdResolver | quote }}

  # Flows
  {{- range $flowName, $flowConfig := .Values.env.app.flows }}
  {{- $flow := $flowName | snakecase | upper }}
  {{- range $key, $val := $flowConfig }}
  {{- $upperKey := $key | snakecase | upper }}
  APP_FLOWS_{{ $flow }}_{{ $upperKey }}: {{ $val | quote }}
  {{- end }}
  {{- end }}

  # Queues
  {{- range $queueName, $q := .Values.env.app.queues }}
  {{- $queue := $queueName | snakecase | upper }}
  APP_QUEUES_{{ $queue }}_JOB_ATTEMPTS: {{ $q.job.attempts | quote }}
  APP_QUEUES_{{ $queue }}_JOB_DELAY: {{ $q.job.delay | quote }}
  {{- if $q.job.backoff }}
  APP_QUEUES_{{ $queue }}_JOB_BACKOFF_TYPE: {{ $q.job.backoff.type | quote }}
  APP_QUEUES_{{ $queue }}_JOB_BACKOFF_DELAY: {{ $q.job.backoff.delay | quote }}
  {{- else }}
  APP_QUEUES_{{ $queue }}_JOB_BACKOFF_TYPE: {{ $q.job.backoffType | quote }}
  APP_QUEUES_{{ $queue }}_JOB_BACKOFF_DELAY: {{ $q.job.backoffDelay | quote }}
  {{- end }}
  APP_QUEUES_{{ $queue }}_WORKER_CONCURRENCY: {{ $q.worker.concurrency | quote }}
  {{- if $q.worker.limiter.enabled }}
  APP_QUEUES_{{ $queue }}_WORKER_LIMITER_MAX: {{ $q.worker.limiter.max | quote }}
  APP_QUEUES_{{ $queue }}_WORKER_LIMITER_DURATION: {{ $q.worker.limiter.duration | quote }}
  {{- end }}
  APP_QUEUES_{{ $queue }}_WORKER_LOCK_DURATION: {{ $q.worker.lockDuration | quote }}
  APP_QUEUES_{{ $queue }}_WORKER_MAX_STALLED_COUNT: {{ $q.worker.maxStalledCount | quote }}
  APP_QUEUES_{{ $queue }}_WORKER_STALLED_INTERVAL: {{ $q.worker.stalledInterval | quote }}
  APP_QUEUES_{{ $queue }}_WORKER_REMOVE_ON_COMPLETE_AGE: {{ $q.worker.removeOnComplete.age | quote }}
  APP_QUEUES_{{ $queue }}_WORKER_REMOVE_ON_COMPLETE_COUNT: {{ $q.worker.removeOnComplete.count | quote }}
  APP_QUEUES_{{ $queue }}_WORKER_REMOVE_ON_FAIL_AGE: {{ $q.worker.removeOnFail.age | quote }}
  {{- if $q.worker.removeOnFail.count }}
  APP_QUEUES_{{ $queue }}_WORKER_REMOVE_ON_FAIL_COUNT: {{ $q.worker.removeOnFail.count | quote }}
  {{- end }}
  {{- if $q.batch }}
  APP_QUEUES_{{ $queue }}_BATCH_SIZE: {{ $q.batch.size | quote }}
  APP_QUEUES_{{ $queue }}_BATCH_MIN_SIZE: {{ $q.batch.minSize | quote }}
  APP_QUEUES_{{ $queue }}_BATCH_TIMEOUT: {{ $q.batch.timeout | quote }}
  APP_QUEUES_{{ $queue }}_BATCH_LOCK_DURATION: {{ $q.batch.lockDuration | quote }}
  {{- end }}
  {{- end }}

  # Clients
  {{- range $clientName, $c := .Values.env.app.clients }}
  {{- $client := $clientName | snakecase | upper }}
  APP_CLIENTS_{{ $client }}_URL: {{ $c.url | quote }}
  APP_CLIENTS_{{ $client }}_TIMEOUT: {{ $c.timeout | quote }}
  APP_CLIENTS_{{ $client }}_ENABLE_RETRY_STRATEGY: {{ $c.retryStrategy.enabled | quote }}
  {{- if $c.retryStrategy.enabled }}
  APP_CLIENTS_{{ $client }}_RETRY_RETRIES: {{ $c.retryStrategy.retries | quote }}
  APP_CLIENTS_{{ $client }}_RETRY_SHOULD_RESET_TIMEOUT: {{ $c.retryStrategy.shouldResetTimeout | quote }}
  APP_CLIENTS_{{ $client }}_RETRY_IS_EXPONENTIAL: {{ $c.retryStrategy.isExponential | quote }}
  APP_CLIENTS_{{ $client }}_RETRY_DELAY: {{ $c.retryStrategy.delay | quote }}
  {{- end }}
  APP_CLIENTS_{{ $client }}_HEADERS: {{ $c.headers | quote }}
  {{- end }}

  # Redis
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_DB: {{ .Values.redis.db | quote }}
  {{- if .Values.redis.keyPrefix }}
  REDIS_KEY_PREFIX: {{ .Values.redis.keyPrefix | quote }}
  {{- end }}

  # BullMQ
  BULLMQ_HOST: {{ .Values.bullmq.host | quote }}
  BULLMQ_PORT: {{ .Values.bullmq.port | quote }}
  BULLMQ_DB: {{ .Values.bullmq.db | quote }}
  {{- if .Values.bullmq.keyPrefix }}
  BULLMQ_KEY_PREFIX: {{ .Values.bullmq.keyPrefix | quote }}
  {{- end }}
{{- end }}
